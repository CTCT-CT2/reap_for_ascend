[project]
name = "reap"
version = "0.1.0"
description = "REAP expert observation and pruning for Ascend NPUs."
readme = "README.md"
authors = [
    { name = "Mike Lasby", email = "mklasby@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.7.0",
    "datasets>=3.6.0, <4.0.0",
    "numpy>=1.26.0",
    "pyyaml>=6.0",
    "safetensors>=0.5.0",
    "tqdm>=4.66.0",
    "transformers>=5.5.0,<5.6.0",
]

[project.urls]
Upstream = "https://github.com/CerebrasResearch/reap"

[project.scripts]
reap-observe = "reap.main:main"
reap-prune = "reap.prune:main"
reap-layerwise-prune = "reap.layerwise_prune:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.4.1",
]

[tool.ruff]
line-length = 88
select = ["SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
